# Public front for Anemi — same pattern as vms.arrobin.com.
# Internet → nginx :80/:443 → 127.0.0.1:3100 (Next) → 127.0.0.1:4100 (Nest)
# Anemi ports stay 3100 / 4100 / 5434. Do not reuse VMS 3000 / 4000 / 5432.

upstream anemi_frontend {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream anemi_backend {
    server 127.0.0.1:4100;
}

server {
    listen 80;
    listen [::]:80;
    server_name anime.arrobin.com;

    server_tokens off;
    client_max_body_size 400m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/wasm text/xml application/xml image/svg+xml;

    location /socket.io/ {
        proxy_pass http://anemi_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://anemi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://anemi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
