services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anemi
      POSTGRES_PASSWORD: anemi
      POSTGRES_DB: anemi
    ports:
      - "5434:5432"
    volumes:
      - anemi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anemi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - anemi_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: anemi
      MINIO_ROOT_PASSWORD: anemi-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - anemi_minio:/data

volumes:
  anemi_pg:
  anemi_redis:
  anemi_minio:
