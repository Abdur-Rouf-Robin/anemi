services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anemi
      POSTGRES_PASSWORD: anemi
      POSTGRES_DB: anemi
    ports:
      - "5434:5432"
    volumes:
      - anemi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anemi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anemi_pg:
