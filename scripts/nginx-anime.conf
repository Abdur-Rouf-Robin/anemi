# Public front for Anemi — same pattern as vms.arrobin.com.
# Internet → nginx :80/:443 → 127.0.0.1:3100 (Next) → 127.0.0.1:4100 (Nest)
# /media is authorized by Nest, then served from disk via X-Accel-Redirect.
# Anemi ports stay 3100 / 4100 / 5434. Do not reuse VMS 3000 / 4000 / 5432.

upstream anemi_frontend {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream anemi_backend {
    server 127.0.0.1:4100;
}

server {
    server_name anime.arrobin.com;

    server_tokens off;
    client_max_body_size 8g;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/wasm text/xml application/xml image/svg+xml;

    location /socket.io/ {
        proxy_pass http://anemi_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /internal-anemi-media/ {
        internal;
        alias /var/www/anemi/data/media/;
        add_header Accept-Ranges bytes;
        expires 1h;
    }

    location /media/ {
        proxy_pass http://anemi_backend/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Anemi-Accel 1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    location /_next/static/ {
        proxy_pass http://anemi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://anemi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anime.arrobin.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anime.arrobin.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = anime.arrobin.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name anime.arrobin.com;
    return 404; # managed by Certbot


}
